[project]
name = "mediflow-backend"
version = "0.1.0"
description = "Backend FastAPI de MediFlow: ingestion, extraccion y triaje de documentos clinicos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "oci>=2.126.0",
    "pypdf>=4.2.0",
    "httpx>=0.27.0",
    "google-genai>=0.3.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
