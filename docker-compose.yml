services:
  postgres:
    image: postgres:16-alpine
    container_name: mediflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Expuesto solo para desarrollo local y clientes como DBeaver / TablePlus
      - "5432:5432"
    volumes:
      # Persistencia de datos en disco (evita pérdida de datos al apagar el contenedor)
      - postgres_data:/var/lib/postgresql/data
      # Script DDL ejecutado automáticamente SOLO en la primera inicialización
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - mediflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  mediflow-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local