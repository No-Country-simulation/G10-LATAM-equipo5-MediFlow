services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediflow_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_db_data:/app/data
      - ./backend/secrets:/secrets:ro
    networks:
      - mediflow_network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: mediflow_n8n
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=America/Bogota
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows
    networks:
      - mediflow_network
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: mediflow_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - mediflow_network
    depends_on:
      - backend

networks:
  mediflow_network:
    driver: bridge

volumes:
  backend_db_data:
  n8n_data:
